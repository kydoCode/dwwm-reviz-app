<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - DWWM ReviZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">DWWM ReviZ</div>
    </div>
    <header class="glass-header">
        <div class="container-fluid d-flex justify-content-between align-items-center py-3">
            <a href="index.html" class="logo-link">
                <img src="logo.svg" alt="DWWM ReviZ" class="app-logo">
            </a>
            <div class="header-actions">
                <button id="usersBtn" class="btn btn-primary me-2">👥 Utilisateurs</button>
                <button id="exportPDF" class="btn btn-success me-2">📄 Export PDF</button>
                <button id="backToApp" class="btn btn-secondary me-2">← Retour App</button>
                <button id="logoutBtn" class="btn btn-danger">Déconnexion</button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <section class="filters-section glass-card mb-4">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Rechercher...">
                </div>
                <div class="col-md-3">
                    <select id="competenceFilter" class="form-select">
                        <option value="">Toutes les compétences</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="niveauFilterAdmin" class="form-select">
                        <option value="">Tous les niveaux</option>
                        <option value="1">Niveau 1 - Réciter</option>
                        <option value="2">Niveau 2 - Appliquer</option>
                        <option value="3">Niveau 3 - Transférer</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button id="addQuestion" class="btn btn-primary w-100">+ Ajouter</button>
                </div>
            </div>
        </section>

        <section id="questionsGrid" class="questions-grid">
            <!-- Questions cards will be inserted here -->
        </section>
    </main>

    <footer class="text-center py-3">
        <a href="index.html" class="logo-link d-block">
            <img src="logo.svg" alt="DWWM ReviZ" class="footer-logo mb-2 mx-auto">
        </a>
        <p class="mb-0">&copy; <span id="currentYear"></span> by Kydo</p>
    </footer>

    <!-- Modal Question Detail/Edit -->
    <div id="questionDetailModal" class="modal">
        <div class="modal-content glass-card modal-large">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Question</h2>
            <form id="questionForm">
                <div class="mb-3">
                    <label class="form-label">ID</label>
                    <input type="text" id="questionId" class="form-control" readonly>
                </div>
                <div class="row mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Compétence</label>
                        <input type="text" id="questionCompetence" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Niveau</label>
                        <select id="questionNiveau" class="form-select" required>
                            <option value="1">Niveau 1 - Réciter</option>
                            <option value="2">Niveau 2 - Appliquer</option>
                            <option value="3">Niveau 3 - Transférer</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Question</label>
                    <textarea id="questionText" class="form-control" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Réponse</label>
                    <textarea id="questionReponse" class="form-control" rows="5" required></textarea>
                </div>
                <div class="modal-footer-custom">
                    <button type="button" id="deleteQuestion" class="btn btn-danger">Supprimer</button>
                    <button type="submit" class="btn btn-success">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/api-config.js"></script>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 800);
        });
    </script>
    <script src="js/admin.js"></script>
    <script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
</body>
</html>
