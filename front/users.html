<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Utilisateurs - DWWM ReviZ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">DWWM ReviZ</div>
    </div>
    <header class="glass-header">
        <div class="container-fluid d-flex justify-content-between align-items-center py-3">
            <a href="index.html" class="logo-link">
                <img src="logo.svg" alt="DWWM ReviZ" class="app-logo">
            </a>
            <div class="header-actions">
                <button id="backToAdmin" class="btn btn-secondary me-2">← Admin</button>
                <button id="logoutBtn" class="btn btn-danger">Déconnexion</button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <section class="glass-card mb-4">
            <button id="addUser" class="btn btn-primary mb-3">+ Ajouter un utilisateur</button>
            <table class="table table-dark">
                <thead>
                    <tr>
                        <th>Nom d'utilisateur</th>
                        <th>Rôle</th>
                        <th>Date de création</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
            </table>
        </section>
    </main>

    <div id="userModal" class="modal">
        <div class="modal-content glass-card">
            <span class="close">&times;</span>
            <h2>Nouvel utilisateur</h2>
            <form id="userForm">
                <div class="mb-3">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" id="newUsername" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" id="newPassword" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Rôle</label>
                    <select id="newRole" class="form-select" required>
                        <option value="visitor">Visitor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success">Créer</button>
            </form>
        </div>
    </div>

    <script src="js/api-config.js"></script>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 800);
        });
    </script>
    <script src="js/users.js"></script>
</body>
</html>
